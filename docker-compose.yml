services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432" # 5433 no host para não conflitar com um Postgres local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: faculdade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faculdade"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./faculdade-back-end
    ports:
      - "3001:3000" # API acessível em http://localhost:3001
    environment:
      PORT: "3000"
      DB_URL: "jdbc:postgresql://postgres:5432/faculdade"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "docker"
      JWT_SECRET: "${JWT_SECRET:-seuSegredoSuperSecreto}"
    volumes:
      - ./faculdade-back-end/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./unidraft-ui
    ports:
      - "3000:3000" # aplicação em http://localhost:3000
    environment:
      API_URL: "http://backend:3000/"
    depends_on:
      - backend

volumes:
  postgres_data:
