version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: faculdade
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./faculdade-back-end
    environment:
      DATABASE_URL: "postgresql://postgres:docker@postgres:5432/faculdade?schema=public"
    volumes:
      - ./faculdade-back-end/logs:/app/logs
    depends_on:
      - postgres

  frontend:
    build: ./unidraft-ui
    environment:
      NEXT_PUBLIC_API_URL: "https://localhost/api/"
      API_URL: "http://backend:3000/"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
